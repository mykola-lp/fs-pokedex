name: Deployment pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check style
        run: npm run eslint

      - name: Test unit
        run: npm test

      - name: Build
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Trigger deployment
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  tag_release:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}

    steps:
      - uses: actions/checkout@v6

      - name: Bump version and push tag
        # uses: anothrNick/github-tag-action@1.75.0
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  notify:
    needs: [simple_deployment_pipeline, tag_release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send success notification
        if: ${{ needs.simple_deployment_pipeline.result == 'success' }}
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "username": "GitHub Actions",
            "content": "## ✅ Deployment successful! A new version deployed to production\n\n**Repository**\n${{ github.repository }}\n\n**Branch**\n${{ github.ref_name }}\n\n**Commit**\n`${{ github.sha }}`\n\n**Message**\n${{ github.event.head_commit.message }}\n\n**Author**\n${{ github.event.head_commit.author.name }}\n\n**Triggered by**\n${{ github.actor }}\n\n**Workflow**\n${{ github.workflow }}\n\n🔗 **Logs**\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'

      - name: Send failure notification
        if: ${{ needs.simple_deployment_pipeline.result == 'failure' }}
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "username": "GitHub Actions",
            "content": "## ❌ Build failed! Deployment aborted\n\n**Repository**\n${{ github.repository }}\n\n**Branch**\n${{ github.ref_name }}\n\n**Commit**\n`${{ github.sha }}`\n\n**Message**\n${{ github.event.head_commit.message }}\n\n**Author**\n${{ github.event.head_commit.author.name }}\n\n**Triggered by**\n${{ github.actor }}\n\n**Workflow**\n${{ github.workflow }}\n\n🚨 Check logs immediately:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'
