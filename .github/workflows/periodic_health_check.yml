name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed service health
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://fs-pokedex-zaam.onrender.com/health
          follow-redirect: true
          max-attempts: 3
          retry-delay: 10s
